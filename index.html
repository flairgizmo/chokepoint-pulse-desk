<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QntDesk — the ledgers already exist. This desk walks how they talk: Overledger, live tokenised sterling, and the people on the record."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>QntDesk — making the networks talk</title>
    <link rel="icon" type="image/svg+xml" href="/brand/qntdesk-mark.svg" />
    <link rel="icon" type="image/png" href="/brand/qntdesk-icon.png" />
    <link rel="apple-touch-icon" href="/brand/qntdesk-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QntDesk — making the networks talk" />
    <meta
      property="og:description"
      content="The ledgers already exist. This desk walks how they talk: Overledger, live tokenised sterling, and the people on the record."
    />
    <meta property="og:image" content="/brand/qntdesk-og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QntDesk — making the networks talk" />
    <meta
      name="twitter:description"
      content="The ledgers already exist. This desk walks how they talk: Overledger, live tokenised sterling, and the people on the record."
    />
    <meta name="twitter:image" content="/brand/qntdesk-og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.coingecko.com" />
    <link rel="preconnect" href="https://unpkg.com" />
    <style>
      .boot {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.85rem;
        margin: 0;
        font-family: Outfit, Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #0b1220;
        background: #ffffff;
      }
      .boot img {
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 14px;
      }
      .boot p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" aria-busy="true" data-boot>
        <img src="/brand/qntdesk-icon.png" width="52" height="52" alt="QntDesk" />
        <p>QntDesk</p>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var boot = document.querySelector('#app [data-boot]');
        if (!boot) return;
        boot.setAttribute('aria-busy', 'false');
        var line = boot.querySelector('p');
        if (line) line.textContent = 'Desk is taking too long. Refresh the page.';
      }, 12000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
