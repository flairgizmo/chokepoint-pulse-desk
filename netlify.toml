[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[template.environment]
  XAI_API_KEY = "Change me to your xAI key from https://console.x.ai"
  XAI_MODEL = "grok-3-mini"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
